plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'de.uni-marburg.diz'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.retry:spring-retry:2.0.13'
    implementation 'org.apache.kafka:kafka-streams'
    implementation 'ca.uhn.hapi:hapi-base:2.6.0'
    implementation 'ca.uhn.hapi:hapi-structures-v25:2.6.0'
    implementation 'ca.uhn.hapi.fhir:hapi-fhir-base:8.12.1'
    implementation 'ca.uhn.hapi.fhir:hapi-fhir-client:8.12.1'
    implementation 'ca.uhn.hapi.fhir:hapi-fhir-structures-r4:8.12.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.apache.kafka:kafka-streams-test-utils'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

test {
    useJUnitPlatform()
}


jacoco {
//    toolVersion = "0.8.10"
    reportsDirectory = layout.buildDirectory.dir('jacoco-reports')
}

jacocoTestReport {
    reports {
        xml.required = true
        csv.required = true
        csv.outputLocation = layout.buildDirectory.file('jacoco/coverage.csv')
        html.outputLocation = layout.buildDirectory.dir('jacoco/html')
    }
}

jar {
    enabled = false
}

bootJar {
    mainClass.set('de.uni_marburg.diz.consent_to_gics.Application')
}

